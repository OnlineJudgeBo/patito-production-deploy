services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.httpchallenge=true
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER}.acme.httpchallenge.entrypoint=web
      - --log.level=${TRAEFIK_LOG_LEVEL}
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_PORT}:80"
      - "${TRAEFIK_HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/letsencrypt:/letsencrypt
    labels:
      traefik.enable: "false"

  patito-db:
    ports: !reset []

  patito-web:
    ports: !reset []
    environment:
      APP_DOMAIN: https://${PATITO_HOST}/oj
      APP_DOMAIN_ADMIN: https://${PATITO_HOST}/admin/
      APP_DOMAIN_API: https://${PATITO_HOST}/api
      VIBE_IDE_BASE_URL: https://${PATITO_HOST}/ide/
    labels:
      traefik.enable: "true"
      traefik.http.routers.patito-web.rule: Host(`${PATITO_HOST}`)
      traefik.http.routers.patito-web.entrypoints: websecure
      traefik.http.routers.patito-web.tls: "true"
      traefik.http.routers.patito-web.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.patito-web.priority: 10
      traefik.http.routers.patito-web.middlewares: oj-trailing-slash@file,compress@file
      traefik.http.services.patito-web.loadbalancer.server.port: 80

  api:
    ports: !reset []
    environment:
      Base__Url: https://${PATITO_HOST}
    labels:
      traefik.enable: "true"
      traefik.http.routers.admin-api.rule: Host(`${PATITO_HOST}`) && (Path(`/api`) || PathPrefix(`/api/`))
      traefik.http.routers.admin-api.entrypoints: websecure
      traefik.http.routers.admin-api.tls: "true"
      traefik.http.routers.admin-api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.admin-api.priority: 100
      traefik.http.routers.admin-api.middlewares: compress@file
      traefik.http.services.admin-api.loadbalancer.server.port: 8080

  patito-lsp-server:
    ports: !reset []
    labels:
      traefik.enable: "true"
      traefik.http.routers.vibe-lsp.rule: Host(`${PATITO_HOST}`) && (Path(`/lsp`) || PathPrefix(`/lsp/`))
      traefik.http.routers.vibe-lsp.entrypoints: websecure
      traefik.http.routers.vibe-lsp.tls: "true"
      traefik.http.routers.vibe-lsp.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.vibe-lsp.priority: 100
      traefik.http.routers.vibe-lsp.middlewares: lsp-strip-prefix@file
      traefik.http.services.vibe-lsp.loadbalancer.server.port: 3001

  patito-ide:
    ports: !reset []
    environment:
      NEXT_PUBLIC_JUDGE_API_URL: https://${PATITO_HOST}/api
      NEXT_PUBLIC_JUDGE_WS_URL: wss://${PATITO_HOST}/api
      NEXT_PUBLIC_VIBE_IDE_CONTEXT_URL: https://${PATITO_HOST}/api/vibe/context
    labels:
      traefik.enable: "true"
      traefik.http.routers.vibe-ide.rule: Host(`${PATITO_HOST}`) && (Path(`/ide`) || PathPrefix(`/ide/`))
      traefik.http.routers.vibe-ide.entrypoints: websecure
      traefik.http.routers.vibe-ide.tls: "true"
      traefik.http.routers.vibe-ide.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.vibe-ide.priority: 100
      traefik.http.routers.vibe-ide.middlewares: compress@file
      traefik.http.services.vibe-ide.loadbalancer.server.port: 3000

  admin-ui:
    ports: !reset []
    labels:
      traefik.enable: "true"

      traefik.http.routers.admin-ui.rule: "Host(`${PATITO_HOST}`) && (Path(`/admin`) || PathPrefix(`/admin/`))"
      traefik.http.routers.admin-ui.entrypoints: websecure
      traefik.http.routers.admin-ui.tls: "true"
      traefik.http.routers.admin-ui.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.admin-ui.priority: "300"
      traefik.http.routers.admin-ui.service: admin-ui
      traefik.http.routers.admin-ui.middlewares: compress@file

      traefik.http.services.admin-ui.loadbalancer.server.port: "80"

  phpmyadmin:
    ports: !reset []
    environment:
      PMA_ABSOLUTE_URI: https://${PATITO_HOST}/pma/
    labels:
      traefik.enable: "true"
      traefik.http.routers.phpmyadmin.rule: Host(`${PATITO_HOST}`) && (Path(`/pma`) || PathPrefix(`/pma/`))
      traefik.http.routers.phpmyadmin.entrypoints: websecure
      traefik.http.routers.phpmyadmin.tls: "true"
      traefik.http.routers.phpmyadmin.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.phpmyadmin.priority: 100
      traefik.http.routers.phpmyadmin.middlewares: pma-strip-prefix@file,compress@file
      traefik.http.services.phpmyadmin.loadbalancer.server.port: 80
