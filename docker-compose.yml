services:
  patito-db:
    image: mariadb:11.3
    restart: unless-stopped
    environment:
      MARIADB_ROOT_HOST: ${MARIADB_ROOT_HOST}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - ./db/mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

  patito-web:
    image: ghcr.io/onlinejudgebo/patito-client-web:patito2-0
    restart: unless-stopped
    depends_on:
      - patito-db
    environment:
      SITE_ID: ${SITE_ID:-1}
      APP_ENV: ${APP_ENV:-production}
      THEME_TEMPLATE: ${THEME_TEMPLATE:-patito}
      APP_PREFIX_ROUTE: ${APP_PREFIX_ROUTE:-/oj}
      APP_DOMAIN: ${APP_DOMAIN:-${PATITO_WEB_PUBLIC_URL}/oj}
      APP_DOMAIN_ADMIN: ${APP_DOMAIN_ADMIN:-http://localhost:${ADMIN_UI_PORT}/admin}
      APP_DOMAIN_API: ${APP_DOMAIN_API:-${ADMIN_API_PUBLIC_URL}}
      JWT_ISS: ${JWT_ISS:-patito}
      JWT_AUD: ${JWT_AUD:-patito}
      MAIL_USER_NAME: ${MAIL_USER_NAME:-}
      MAIL_SUBJECT: ${MAIL_SUBJECT:-Juez Virtual}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DB_HOST: patito-db
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASS: ${MARIADB_PASSWORD}
      VIBE_IDE_BASE_URL: ${VIBE_IDE_PUBLIC_URL}
      VIBE_IDE_TOKEN_SECRET: ${VIBE_IDE_TOKEN_SECRET}
      VIBE_IDE_TOKEN_TTL_SECONDS: ${VIBE_IDE_TOKEN_TTL_SECONDS:-7200}
      TZ: ${TZ}
    volumes:
      - ./config/patito-web.env:/var/www/html/client-web/.env:ro
    ports:
      - "${PATITO_WEB_PORT}:80"

  patito-judge-kernel:
    image: ghcr.io/onlinejudgebo/onlinejudgebo-kernel:develop
    restart: unless-stopped
    depends_on:
      - patito-db
    user: root
    environment:
      LANG: en_US.UTF-8
      HOME: /home/judge
      CONF: /home/judge/etc/judge.conf
      TZ: ${TZ}
      OJ_HOST_NAME: ${OJ_HOST_NAME}
      OJ_USER_NAME: ${OJ_USER_NAME}
      OJ_PASSWORD: ${OJ_PASSWORD}
      OJ_DB_NAME: ${OJ_DB_NAME}
      OJ_PORT_NUMBER: ${OJ_PORT_NUMBER}
      OJ_RUNNING: ${OJ_RUNNING}
      OJ_SLEEP_TIME: ${OJ_SLEEP_TIME}
      OJ_JAVA_TIME_BONUS: ${OJ_JAVA_TIME_BONUS}
      OJ_JAVA_MEMORY_BONUS: ${OJ_JAVA_MEMORY_BONUS}
      OJ_JAVA_XMS: ${OJ_JAVA_XMS}
      OJ_JAVA_XMX: ${OJ_JAVA_XMX}
      OJ_SIM_ENABLE: ${OJ_SIM_ENABLE}
      OJ_OI_MODE: ${OJ_OI_MODE}
      OJ_SHM_RUN: ${OJ_SHM_RUN}
      OJ_USE_MAX_TIME: ${OJ_USE_MAX_TIME}
      OJ_LANG_SET: ${OJ_LANG_SET}
    entrypoint:
      - /bin/bash
      - -lc
      - /opt/patito/write-judge-conf.sh && exec /usr/bin/judged /home/judge
    tty: true
    stdin_open: true
    volumes:
      - ./data/judge:/home/judge
      - ./scripts/write-judge-conf.sh:/opt/patito/write-judge-conf.sh:ro

  api:
    image: ghcr.io/onlinejudgebo/onlinejudgebo-admin-api:develop
    restart: unless-stopped
    depends_on:
      - patito-db
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: server=patito-db;database=${MARIADB_DATABASE};user=${MARIADB_USER};pwd=${MARIADB_PASSWORD};AllowZeroDateTime=True;ConvertZeroDateTime=True;convert zero datetime=True
      ConnectionStrings__ScheduleConnection: server=patito-db;database=schedule_management;user=${MARIADB_USER};pwd=${MARIADB_PASSWORD};AllowZeroDateTime=True;ConvertZeroDateTime=True;convert zero datetime=True
      Base__Url: ${PATITO_WEB_PUBLIC_URL}
      FileSettings__ProblemsFilePath: /tmp/zas
      VIBE_IDE_TOKEN_SECRET: ${VIBE_IDE_TOKEN_SECRET}
      TZ: ${TZ}
    volumes:
      - ./data/judge/data:/tmp/zas
    ports:
      - "${ADMIN_API_PORT}:8080"

  admin-ui:
    image: ghcr.io/onlinejudgebo/patito-admin-ui:main
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ}
    ports:
      - "${ADMIN_UI_PORT}:80"

  patito-lsp-server:
    image: ghcr.io/onlinejudgebo/patito-ide-lsp-server:main
    restart: unless-stopped
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      LSP_AUTH_TOKEN: ${LSP_AUTH_TOKEN}
      LSP_WORKSPACE: /workspace
      JDTLS_WORKSPACE: /tmp/jdtls-workspace
      LSP_JAVA_ARGS: -data /tmp/jdtls-workspace
      LSP_CPP_ARGS: --background-index --query-driver=/usr/bin/g++
      TZ: ${TZ}
    volumes:
      - ./data/vibe-lsp/workspace:/workspace
      - ./data/vibe-lsp/storage:/storage:ro
    ports:
      - "${VIBE_LSP_PORT}:3001"

  patito-ide:
    image: ghcr.io/onlinejudgebo/patito-ide:main
    restart: unless-stopped
    depends_on:
      - patito-lsp-server
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      VIBE_IDE_BASE_PATH: /ide
      NEXT_PUBLIC_BASE_PATH: /ide
      NEXT_PUBLIC_JUDGE_API_URL: ${ADMIN_API_PUBLIC_URL}
      NEXT_PUBLIC_JUDGE_WS_URL: ${ADMIN_API_PUBLIC_WS_URL}
      NEXT_PUBLIC_VIBE_IDE_CONTEXT_URL: ${VIBE_IDE_CONTEXT_URL}
      LSP_AUTH_TOKEN: ${LSP_AUTH_TOKEN}
      LSP_SERVER_WS_BASE: ws://patito-lsp-server:3001
      TZ: ${TZ}
    ports:
      - "${VIBE_IDE_PORT}:3000"

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    profiles:
      - tools
    depends_on:
      - patito-db
    environment:
      PMA_HOST: patito-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      PMA_ABSOLUTE_URI: ${PHPMYADMIN_PUBLIC_URL}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT}
      TZ: ${TZ}
    ports:
      - "${PHPMYADMIN_PORT}:80"
